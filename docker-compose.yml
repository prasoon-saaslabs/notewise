services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notewise
      POSTGRES_PASSWORD: notewise
      POSTGRES_DB: notewise
    ports:
      - "5432:5432"
    volumes:
      - notewise_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notewise"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://notewise:notewise@postgres:5432/notewise
      REDIS_URL: redis://redis:6379
      AI_WORKER_URL: http://ai-worker:8001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-worker:
        condition: service_started

  ai-worker:
    build:
      context: services/ai-worker
      dockerfile: Dockerfile
    env_file: .env
    environment:
      AI_WORKER_PORT: 8001
    ports:
      - "8001:8001"

volumes:
  notewise_pg:
